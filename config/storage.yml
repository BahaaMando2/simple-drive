# Which backend new blobs are written to, plus per-backend settings.
# Values are emitted with to_json so passwords containing YAML syntax
# (e.g. "#" or ": ") stay intact; an unset variable becomes null.
default: &default
  backend: <%= ENV.fetch("STORAGE_BACKEND", "local").to_json %>
  local:
    path: <%= ENV.fetch("LOCAL_STORAGE_PATH", "storage/blobs").to_json %>
  s3:
    endpoint: <%= ENV["S3_ENDPOINT"].to_json %>
    bucket: <%= ENV["S3_BUCKET"].to_json %>
    region: <%= ENV.fetch("S3_REGION", "us-east-1").to_json %>
    access_key_id: <%= ENV["S3_ACCESS_KEY_ID"].to_json %>
    secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"].to_json %>
  ftp:
    host: <%= ENV["FTP_HOST"].to_json %>
    port: <%= ENV.fetch("FTP_PORT", "21").to_json %>
    user: <%= ENV["FTP_USER"].to_json %>
    password: <%= ENV["FTP_PASSWORD"].to_json %>

development:
  <<: *default

test:
  <<: *default
  backend: local
  local:
    path: tmp/storage/test

production:
  <<: *default
