# Which backend new blobs are written to, plus per-backend settings.
default: &default
  backend: <%= ENV.fetch("STORAGE_BACKEND", "local") %>
  local:
    path: <%= ENV.fetch("LOCAL_STORAGE_PATH", "storage/blobs") %>
  s3:
    endpoint: <%= ENV["S3_ENDPOINT"] %>
    bucket: <%= ENV["S3_BUCKET"] %>
    region: <%= ENV.fetch("S3_REGION", "us-east-1") %>
    access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
    secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  ftp:
    host: <%= ENV["FTP_HOST"] %>
    port: <%= ENV.fetch("FTP_PORT", 21) %>
    user: <%= ENV["FTP_USER"] %>
    password: <%= ENV["FTP_PASSWORD"] %>

development:
  <<: *default

test:
  <<: *default
  backend: local
  local:
    path: tmp/storage/test

production:
  <<: *default
